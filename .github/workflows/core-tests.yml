name: Core tests

on:
  push:
  pull_request:

jobs:
  app:
    name: App (types, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Tests (puzzle engine, shipped content, save, scenes, English)
        run: npx jest --ci
