name: Core tests

on:
  push:
  pull_request:

jobs:
  app:
    name: App (types, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Tests (puzzle engine, shipped content, save, scenes, English)
        run: npx jest --ci --testPathIgnorePatterns free.test newFamilies.test
      # The tests that time the work done on the phone run alone, one file after the other: run
      # beside the others, they would time a crowded test machine rather than the game.
      - name: Tests (timed - Free play, Sliding Tiles hints)
        run: npx jest --ci --runInBand free.test newFamilies.test
